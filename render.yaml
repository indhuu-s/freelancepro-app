services:
  - type: web
    name: freelancepro
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --no-input
    startCommand: gunicorn freelancepro.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freelancepro-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.14.3