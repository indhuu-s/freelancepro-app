services:
  - type: web
    name: freelancepro
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn freelancepro.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freelancepro-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.14.3