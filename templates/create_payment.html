{% load bootstrap5 %}
<!DOCTYPE html>
<html>
<head>
    <title>Make Payment - FreelancePro</title>
    {% bootstrap_css %}
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3>💰 Make Payment</h3>
                    </div>
                    <div class="card-body">
                        <h5>{{ project.title }}</h5>
                        <p><strong>Amount:</strong> ${{ project.total_amount }}</p>
                        <p><strong>Freelancer:</strong> {{ project.freelancer.username }}</p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-success w-100">
                                Pay ${{ project.total_amount }} with Stripe
                            </button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="{% url 'project_detail' project.id %}" class="btn btn-secondary">← Back to Project</a>
                </div>
            </div>
        </div>
    </div>
    {% bootstrap_javascript %}
</body>
</html>
