{% load bootstrap5 %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">🚀 FreelancePro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'job_list' %}">💼 Jobs</a>
                </li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">📊 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'my_proposals' %}">📋 Proposals</a>
                    </li>
                    {% if user.user_type == 'client' or user.user_type == 'both' %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'post_job' %}">📝 Post Job</a>
                        </li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="{% url 'logout' %}">🚪 Logout</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">🔐 Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register' %}">📝 Register</a>
                    </li>
